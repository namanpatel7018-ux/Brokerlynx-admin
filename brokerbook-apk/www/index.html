<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brokerlynx</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--card:#fff;--tx:#0f1d2b;--mu:#64748b;--bd:#e0e6ed;--pr:#0b3b3c;--pr2:#17696a;--pb:#0b3b3c;--pt:#fff;--br:#d9a84e;--brt:#94670f;--ok:#15803d;--okb:#dcf5e4;--wa:#a05a05;--wab:#fdf0d5;--er:#b42318;--erb:#fde4e1;--gr:#475569;--grb:#e6ebf1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1117;--card:#121c25;--tx:#e8eef3;--mu:#8ea1b1;--bd:#223240;--pr:#0f4a4b;--pr2:#1b7b7a;--pb:#35c0ad;--pt:#04201d;--ok:#4ade80;--okb:#12311f;--wa:#f5c15d;--wab:#3a2c0d;--er:#ff8a80;--erb:#3b1613;--gr:#a9b8c6;--grb:#1e2c38;--brt:#d9a84e}}
:root[data-theme="dark"]{--bg:#0a1117;--card:#121c25;--tx:#e8eef3;--mu:#8ea1b1;--bd:#223240;--pr:#0f4a4b;--pr2:#1b7b7a;--pb:#35c0ad;--pt:#04201d;--ok:#4ade80;--okb:#12311f;--wa:#f5c15d;--wab:#3a2c0d;--er:#ff8a80;--erb:#3b1613;--gr:#a9b8c6;--grb:#1e2c38;--brt:#d9a84e}
*,*:before,*:after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:500 14px/1.4 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
header{padding:14px 18px 6px;display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:11px;object-fit:cover;background:#fefefc;border:1px solid var(--bd)}
header b{font-size:18px;font-weight:800;letter-spacing:-.3px}header small{display:block;color:var(--mu);font-size:11.5px;font-weight:600;margin-top:-2px}
main{flex:1;overflow-y:auto;padding:8px 16px 96px}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd)}
nav button{flex:1;background:none;border:0;padding:9px 0 10px;color:var(--mu);font:700 10px Manrope,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button.on{color:var(--pr2)}nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on svg{stroke-width:2.3}
.wm{display:flex;align-items:center;justify-content:center;gap:11px;padding:6px 0 calc(7px + env(safe-area-inset-bottom,0px));background:var(--card);color:var(--mu);font:600 10.5px/1 Manrope,system-ui,sans-serif;letter-spacing:.14em;user-select:none;-webkit-user-select:none}
.wm:before,.wm:after{content:"";width:30px;height:1px;background:linear-gradient(90deg,transparent,var(--br))}
.wm:after{transform:scaleX(-1)}
.wm b{color:var(--brt);font-weight:800;letter-spacing:.16em}
.wm.in{background:none;padding:18px 0 4px}
.hero{background:linear-gradient(150deg,var(--pr),var(--pr2));color:#fff;border-radius:22px;padding:18px 18px 16px;margin:6px 0 14px}
.hero small{opacity:.78;font-weight:600;font-size:12px}.hero .big{font-size:36px;font-weight:800;letter-spacing:-1px;margin:2px 0 12px;line-height:1.1}.hero .big span{font-size:15px;font-weight:700;color:var(--br);margin-left:5px;letter-spacing:0}
.hero .st{display:flex;gap:10px}.hero .st div{flex:1;background:rgba(255,255,255,.12);border-radius:12px;padding:8px 10px}.hero .st b{display:block;font-size:15px;font-weight:700}
.srch{width:100%;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:12px 14px;font:500 15px Manrope,system-ui,sans-serif;outline:none}
.srch:focus,.f input:focus,.f select:focus{border-color:var(--pr2);box-shadow:0 0 0 3px color-mix(in srgb,var(--pr2) 22%,transparent)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:20px;padding:6px 13px;font:700 12.5px Manrope,system-ui,sans-serif;cursor:pointer}
.chips button.on{background:var(--pb);color:var(--pt);border-color:var(--pb)}
.cd{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:10px;cursor:pointer}
.cd:active{transform:scale(.99)}.r1{display:flex;justify-content:space-between;align-items:center}.r1 b{font-size:15px;font-weight:800}
.bd{font-size:11.5px;font-weight:700;border-radius:20px;padding:3px 10px}.bd.Pending{background:var(--wab);color:var(--wa)}.bd.Expired{background:var(--erb);color:var(--er)}.bd.Completed{background:var(--okb);color:var(--ok)}.bd.Cancelled{background:var(--grb);color:var(--gr)}
.pt{margin:6px 0 2px;font-weight:700}.pt i{color:var(--mu);font-style:normal;font-weight:500}.mu{color:var(--mu);font-size:12.5px}
.r3{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:12.5px;color:var(--mu)}.r3 b{color:var(--tx);font-weight:700}
.bar{height:5px;border-radius:5px;background:var(--grb);margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--br);border-radius:5px}
.emp{text-align:center;color:var(--mu);padding:44px 20px}.emp b{display:block;color:var(--tx);font-size:16px;margin-bottom:4px}
.fab{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom,0px));right:max(18px,calc(50% - 242px));background:var(--pb);color:var(--pt);border:0;border-radius:18px;padding:14px 20px;font:800 14px Manrope,system-ui,sans-serif;box-shadow:0 8px 22px rgba(0,0,0,.28);cursor:pointer;z-index:5}
.ov{position:fixed;inset:0;background:rgba(6,16,26,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.pn{background:var(--card);width:100%;max-width:520px;max-height:93%;overflow:auto;border-radius:24px 24px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
#spl{position:fixed;inset:0;z-index:9999;background:radial-gradient(120% 90% at 50% 30%,#12303B 0%,#0A1A22 55%,#050C11 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .55s ease,transform .55s ease}
#spl.out{opacity:0;transform:scale(1.04);pointer-events:none}
#spl img{width:104px;height:104px;border-radius:27px;object-fit:cover;box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 38px rgba(217,168,78,.28);animation:spi .9s cubic-bezier(.2,.9,.25,1.2) both}
#spl h1{margin:22px 0 4px;font-size:28px;letter-spacing:.14em;font-weight:800;animation:spt .7s .45s ease both}
#spl p{margin:0;font-size:12.5px;letter-spacing:.16em;color:#D9A84E;text-transform:uppercase;animation:spt .7s .7s ease both}
#spl i{display:block;height:2px;width:0;margin-top:26px;border-radius:2px;background:linear-gradient(90deg,transparent,#D9A84E,transparent);animation:spl 1.1s .5s ease forwards}
@keyframes spi{from{opacity:0;transform:scale(.4) rotate(-12deg)}to{opacity:1;transform:none}}@keyframes spt{from{opacity:0;transform:translateY(12px);letter-spacing:.3em}to{opacity:1;transform:none}}@keyframes spl{to{width:170px}}
@media(prefers-reduced-motion:reduce){#spl *{animation:none!important}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}@media(prefers-reduced-motion:reduce){.pn{animation:none}}
.grab{width:38px;height:4px;border-radius:4px;background:var(--bd);margin:4px auto 12px}
.pn h2{margin:0 0 12px;font-size:20px;font-weight:800;letter-spacing:-.3px}
.f{margin-bottom:12px}.f>span{display:block;font-size:12.5px;font-weight:700;color:var(--mu);margin-bottom:5px}
.f input,.f select{width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;padding:12px;font:500 16px Manrope,system-ui,sans-serif;outline:none;min-width:0}
.f textarea{width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;padding:12px;font:500 14px/1.45 Manrope,system-ui,sans-serif;outline:none;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;gap:8px}
.btn{width:100%;background:var(--pb);color:var(--pt);border:0;border-radius:14px;padding:14px;font:800 15px Manrope,system-ui,sans-serif;cursor:pointer;margin-top:4px}
.btn2{background:var(--grb);color:var(--tx);border:0;border-radius:12px;padding:0 16px;font:700 13.5px Manrope,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.btn.s{background:var(--grb);color:var(--tx)}.btn.d{background:var(--erb);color:var(--er)}.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.acts .btn{margin:0;padding:12px;font-size:13.5px}
.hint{font-size:12.5px;font-weight:600;margin:-6px 0 10px;min-height:0;color:var(--mu)}.hint.ok{color:var(--ok)}.hint.bad,.er{color:var(--er)}.er{font-weight:700;font-size:13px;margin:2px 0 8px}
.amt{background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;margin-bottom:12px;font-weight:700}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;margin-bottom:6px}.kv span{display:block;font-size:11.5px;color:var(--mu);font-weight:600}.kv b{font-size:14.5px;font-weight:700;word-break:break-word}.kv .w{grid-column:1/-1}
.lk{color:var(--pr2);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.sec{font-size:13px;font-weight:800;margin:16px 0 8px}.dl{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--bd)}.dl button{background:none;border:0;color:var(--er);font-size:18px;cursor:pointer}
.gbx{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--okb);border-radius:14px;padding:12px;margin:0 0 12px}.gbx span{display:block;font-size:11px;color:var(--mu);font-weight:600}.gbx b{font-size:13.5px;font-weight:700}.gbx .w{grid-column:1/-1;font-size:11.5px}
.tag{font-size:11px;font-weight:700;color:var(--mu);border:1px solid var(--bd);border-radius:6px;padding:1px 7px;margin-left:6px}
#toast{position:fixed;left:50%;bottom:calc(116px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:13px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center}
#toast.on{opacity:1}
</style></head><body>

<script>
const K='brokerbook_v1';let db={l:[],c:[],n:1};
try{const s=JSON.parse(localStorage.getItem(K));if(s)db=s}catch(e){}
const SNP='bb_snap_';
function snapKeys(){const k=[];try{for(let i=0;i<localStorage.length;i++){const n=localStorage.key(i);if(n&&n.startsWith(SNP))k.push(n)}}catch(e){}return k.sort()}
function snapNow(label,raw){try{const ks=snapKeys();while(ks.length>=8)localStorage.removeItem(ks.shift());localStorage.setItem(SNP+Date.now()+'_'+Math.random().toString(36).slice(2,5),JSON.stringify({at:new Date().toISOString(),label,raw}))}catch(e){}}
function snapList(){const a=[];snapKeys().forEach(k=>{try{const v=JSON.parse(localStorage.getItem(k));a.push({k,at:v.at,label:v.label,raw:v.raw})}catch(e){}});return a.sort((x,y)=>y.at.localeCompare(x.at))}
const CODEF={n:'Sunshine Industries',g:'',ph:'7984324410',em:'sunshineindust@gmail.com',ad:''};
const CO=()=>Object.assign({},CODEF,db.co||{});
const coLine=g=>{const o=CO();return[g!==0&&o.g?'GSTIN: '+o.g:'',o.ph?'Tel: '+o.ph:'',o.em?'Email: '+o.em:''].filter(Boolean).join('   |   ')};
const save=()=>{try{const d=new Date(),day=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),prev=localStorage.getItem(K);if(prev&&db.sd!==day){db.sd=day;snapNow('Automatic daily snapshot',prev)}localStorage.setItem(K,JSON.stringify(db))}catch(e){}};
const $=s=>document.querySelector(s),p2=n=>String(n).padStart(2,'0');
(()=>{const s=$('#spl');if(!s)return;const l=$('.logo');if(l)s.querySelector('img').src=l.src;setTimeout(()=>s.classList.add('out'),1900);setTimeout(()=>s.remove(),2600)})();

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const fd=s=>s?new Date(s+'T00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'';
const n3=n=>(+n).toLocaleString('en-IN',{maximumFractionDigits:3}),inr=n=>'₹'+(+n).toLocaleString('en-IN',{maximumFractionDigits:2});
const nk=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
const L=id=>db.l.find(x=>x.id==id),C=id=>db.c.find(x=>x.id==id),ln=id=>L(id)?L(id).name:'(deleted)';
const dv=c=>(c.d||[]).reduce((s,x)=>s+x.q,0),pe=c=>Math.max(0,+(c.q-dv(c)).toFixed(3));
const st=c=>c.x?'Cancelled':pe(c)<=0?'Completed':c.v<ymd(new Date())?'Expired':'Pending';
const open=c=>{const s=st(c);return s=='Pending'||s=='Expired'};
const KG=c=>c&&(c.ru=='g'||c.ru=='q'),uq=c=>c&&c.ru=='n'?'Nos':KG(c)?'Kgs':'MT',mul=c=>c&&(c.ru=='m'||c.ru=='n'||c.ru=='q')?1:c&&c.ru=='g'?.1:100,t10=c=>KG(c)?.1:100,rtS=c=>({k:'10 kg',m:'MT',n:'Nos',g:'10 kg',q:'kg'}[(c&&c.ru)||'k']);
const amtOf=(c,q)=>c.ru=='g'?q/10*c.r:q*mul(c)*c.r;
const vq=(c,q)=>n3(q)+' '+uq(c),kgT=(c,q)=>uq(c)=='MT'?'  ('+n3(q*1000)+' kg)':KG(c)?'  ('+n3(q/1000)+' MT)':'';
const qkg=(c,q)=>uq(c)=='MT'?Math.round(q*1000):KG(c)?q:'';
const altR=c=>({k:['Rate per MT',c.r*100],g:['Rate per MT',c.r*100],m:['Rate per 10 kg',c.r/100],q:['Rate per MT',c.r*1000]}[c.ru||'k']||null);
const qsum=(a,f=c=>c.q,h)=>{const t={MT:0,Kgs:0,Nos:0};a.forEach(c=>{t[uq(c)]+=f(c)});const p=[];['MT','Kgs','Nos'].forEach(u=>{if(t[u]||(u=='MT'&&!t.Kgs&&!t.Nos))p.push(n3(t[u])+(h?'<span>'+u+'</span>':' '+u))});return p.join(h?' + ':' + ')};
const val=c=>amtOf(c,c.q);
const ML=['J','F','M','A','M','J','J','A','S','O','N','D'];
const ymNow=()=>{const n=new Date();return n.getFullYear()+'-'+p2(n.getMonth()+1)};
const mkNo=(pre,arr)=>{const n=new Date(),Lt=pre+ML[n.getMonth()],y=String(n.getFullYear()).slice(-2),re=new RegExp('^'+Lt+'(\\d+)'+y+'$'),ym=ymNow(),v=arr.filter(x=>(x.cm||x.dt.slice(0,7))==ym).map(x=>{const m=re.exec(x.no);return m?+m[1]:-1}).filter(k=>k>=0);return Lt+(v.length?Math.max(...v)+1:0)+y};
const MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'],BTZ='Asia/Kolkata';
const bizYM=()=>{const p={};new Intl.DateTimeFormat('en-US',{timeZone:BTZ,year:'numeric',month:'2-digit'}).formatToParts(new Date()).forEach(x=>p[x.type]=x.value);return p.year+'-'+p.month};
const fmtNo=(ym,n,pre='S')=>pre+MON[+ym.slice(5,7)-1]+n+ym.slice(2,4);
const seqOf=(no,ym,pre='S')=>{const m=new RegExp('^'+pre+MON[+ym.slice(5,7)-1]+'(\\d+)'+ym.slice(2,4)+'$').exec(String(no||''));return m?+m[1]:-1};
db.sq=db.sq||{};db.sqo=db.sqo||{};
const peekSeq=(ym,arr=db.c,sq=db.sq,pre='S')=>Math.max(sq[ym]||0,...arr.map(c=>seqOf(c.no,ym,pre)+1),0);
const nextNo=()=>fmtNo(bizYM(),peekSeq(bizYM()));
const allocNo=(arr=db.c,k='sq',pre='S')=>{const ym=bizYM();db[k]=db[k]||{};let n=peekSeq(ym,arr,db[k],pre);while(arr.some(c=>c.no==fmtNo(ym,n,pre)))n++;db[k][ym]=n+1;return fmtNo(ym,n,pre)};
const allocDo=()=>allocNo(db.o,'sqo','DOS');
function migNo(){if(db.nv>=3)return;const bak=JSON.stringify(db);try{localStorage.setItem(K+'_pre_numbering_backup',bak)}catch(e){}
 try{const g={};db.c.forEach((c,i)=>{const ym=(c.dt||'').slice(0,7)||c.cm||bizYM();(g[ym]=g[ym]||[]).push({c,i})});
  Object.keys(g).sort().forEach(ym=>{g[ym].sort((a,b)=>(a.c.dt||'').localeCompare(b.c.dt||'')||(a.c.tm||'').localeCompare(b.c.tm||'')||a.i-b.i).forEach((x,k)=>{const nn=fmtNo(ym,k);if(x.c.no!=nn&&!x.c.on)x.c.on=x.c.no;x.c.no=nn});db.sq[ym]=g[ym].length});
  const b0=JSON.parse(bak),ids=new Set(db.c.map(c=>c.id)),nos=new Set(db.c.map(c=>c.no));

function ddl(id){unsyncDo(id);db.o=db.o.filter(x=>x.id!=id);save();cs();render();toast('Delivery order deleted')}
async function savePdf(blob,fn,msg,title){
 const cap=window.Capacitor,P=cap&&cap.Plugins;
 if(cap&&cap.isNativePlatform&&cap.isNativePlatform()&&P&&P.Filesystem&&P.Share){
  const b64=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(blob)});
  const f=await P.Filesystem.writeFile({path:fn,data:b64,directory:'CACHE'});
  await P.Share.share({title:title,text:msg||'',url:f.uri,dialogTitle:'Share file'});return}
 const file=new File([blob],fn,{type:'application/pdf'});
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],text:msg||''});return}catch(e){if(e&&e.name=='AbortError')return}}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)
}

 const{d,c}=r,fn='Contract-'+String(c.no).replace(/[^\w-]/g,'')+'.pdf',blob=d.output('blob');
 const msg=who?`Contract ${c.no}: ${c.item}, ${vq(c,c.q)} at ${inr(c.r)} per ${rtS(c)}${txT(c)?' ('+txT(c).toLowerCase()+')':''}. Please find the contract note attached.\n- ${CO().n}${CO().ph?', '+CO().ph:''}`:'';
 try{await savePdf(blob,fn,msg,'Contract '+c.no);toast(who?'Choose WhatsApp to send':'PDF ready')}catch(e){if(!/cancel/i.test(String(e&&e.message||e)))toast('Could not create the PDF')}
}
/* one-time migration: rates per MT -> per 10 kg, build item master */
if(!db.v){db.i=db.i||[];db.c.forEach(c=>{c.r=+(c.r/100).toFixed(4);if(c.item&&!db.i.some(i=>nk(i.name)==nk(c.item)))db.i.push({id:uid(),name:c.item})});db.v=2;save()}
db.i=db.i||[];db.o=db.o||[];db.t=db.t||[];db.vh=db.vh||[];
if(!db.mv){db.o.forEach(o=>{if(o.tn&&!db.t.some(t=>nk(t.name)==nk(o.tn)))db.t.push({id:uid(),name:o.tn});const t=db.t.find(t=>nk(t.name)==nk(o.tn||''));if(o.vn&&!db.vh.some(v=>v.no==o.vn))db.vh.push({id:uid(),no:o.vn,t:t?t.id:''})});db.mv=1;save()}

render();
